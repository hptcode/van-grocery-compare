const STORES=["88 Supermarket", "Big Crazy \u67cf\u4ec1\u8d85\u5e02", "Buy-Low Foods", "Foody World \u8c50\u6cf0", "FreshCo", "Freshmart", "H Mart", "New Empire \u65b0\u5e1d\u570b", "New Pacific \u6771\u6607\u8d85\u5e02", "No Frills", "PriceSmart \u4f73\u5ec9", "Rice World \u4e2d\u570b\u4e16\u754c", "Safeway", "Save-On-Foods", "Superstore", "T&T \u5927\u7d71\u83ef", "Walmart", "\u8d85\u5e022000"];
const CATS=[...new Set(DATA.map(d=>d.category))].sort();
let curCat=null, curItem=null;
const catSel=document.getElementById('catSel'), itemsEl=document.getElementById('items'),
      resultEl=document.getElementById('result'), emptyEl=document.getElementById('empty'),
      searchEl=document.getElementById('search'), cntEl=document.getElementById('cnt');
CATS_ZH={'Featured':'特色','Produce':'生鮮蔬果','Seafood':'海鮮','Meat':'肉類','Frozen':'冷凍食品','Grocery':'雜貨','Bakery':'烘焙','Kitchen':'廚房用品','Prepared Food':'熟食','Beauty & Household':'美妝日用','Health & Household':'保健日用','Hot Pot':'火鍋','Member Price':'會員價'};
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c+(CATS_ZH[c]?' '+CATS_ZH[c]:'')+' ('+DATA.filter(d=>d.category===c).length+')';catSel.appendChild(o);});
const allOpt=document.createElement('option');allOpt.value='ALL';allOpt.textContent='All Items 全部 ('+DATA.length+')';catSel.insertBefore(allOpt,catSel.firstChild);
catSel.value='ALL';curCat='ALL';
catSel.onchange=()=>{searchEl.value='';curCat=catSel.value||null;curItem=null;resultEl.innerHTML='';renderItems();};
function fmt(v,u){if(v==null)return '—';let s='$'+v.toFixed(2);if(u==='/lb')s+='/lb';if(u==='case')s+=' case';return s;}
function ents(d,s){const x=d.stores[s];if(!x)return [];return Array.isArray(x)?x:[x];}
function entryHtml(e){let extra='';
  if(e.member_price!=null)extra+='<span class="badge">Member $'+e.member_price.toFixed(2)+'</span>';
  if(e.regular_price!=null)extra+='<span class="note">reg '+fmt(e.regular_price,e.unit)+'</span>';
  return '<div class="price">'+fmt(e.price,e.unit)+'</div><div class="note">'+(e.unit==='ea'?'each':e.unit)+extra+
    (e.name?'<br>'+e.name:'')+(e.note?'<br>'+e.note:'')+'</div>';}
function storeRow(d,s){const es=ents(d,s);if(!es.length)return '<td>—</td>';
  const tag=es.length>1?'<div class="note">'+es.length+' sizes</div>':'';
  return '<td>'+tag+es.map(entryHtml).join('<hr style="border:0;border-top:1px solid #eee;margin:4px 0">')+'</td>';}
function pick(d){
  curItem=d;renderItems();
  const act=selectedStores();
  const all=act.flatMap(s=>ents(d,s).map(e=>({s,e})));
  const groups={};all.forEach(o=>{if(o.e.price==null)return;const u=o.e.unit==='/lb'?'/lb':'ea';
    (groups[u]=groups[u]||[]).push(o);});
  let bestGroup=null,bestVal=Infinity;
  Object.entries(groups).forEach(([u,arr])=>{const m=Math.min(...arr.map(o=>o.e.price));if(m<bestVal){bestVal=m;bestGroup=u;}});
  let bestStoreName=null;
  if(bestGroup)bestStoreName=groups[bestGroup].reduce((a,b)=>a.e.price<b.e.price?a:b).s;
  let rows=act.map((s)=>{const es=ents(d,s);
    const isBest=es.some(e=>e.price!=null&&bestStoreName===s&&(e.unit==='/lb'?'/lb':'ea')===bestGroup);
    const cls=isBest?' class="best"':'';
    const alt=es.length&&es[0].name_zh?'<span class="zh"> '+es[0].name_zh+'</span>':(es.length&&es[0].name_ko?' <span class="note">('+es[0].name_ko+')</span>':'');
    return '<tr'+cls+'><td><b>'+s+'</b>'+alt+'</td>'+storeRow(d,s)+'</tr>';}).join('');
  const dzh=d.name_zh?' <span class="zh">'+d.name_zh+'</span>':'';
  resultEl.innerHTML='<table><tr><th>Store 商店</th><th>Price 價格</th></tr>'+rows+'</table>'+
   '<div class="note" style="margin-top:8px">Showing: <b>'+d.name+'</b>'+dzh+
   (bestStoreName!=null?' · best price at '+bestStoreName+' ('+bestGroup+')':'')+
   '. Items matched by name — check units before comparing /lb vs each. Prices converted to per-unit where multi-buy.</div>';
  // Mobile: bring the price table into view so users see the prices, not just the title bar
  if(window.matchMedia('(max-width:760px)').matches) resultEl.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderItems(){
  const q=searchEl.value.trim().toLowerCase();
  // 'ALL' shows everything; when searching with text, also search across all categories
  const act=selectedStores();
  const list=DATA.filter(d=>(curCat==='ALL'||!curCat||d.category===curCat)&&
    (!q||(d.name.toLowerCase().includes(q)||(d.name_zh||'').includes(q)||(d.search||'').includes(q)))&&
    act.some(s=>ents(d,s).length));
  itemsEl.innerHTML='';
  emptyEl.style.display=list.length?'none':'block';
  cntEl.textContent='('+list.length+(q?' · search':'')+')';
  list.forEach(d=>{
    const b=document.createElement('button');
    const ns=act.filter(s=>ents(d,s).length).length;
    const catTag=(curCat==='ALL'||q)?'<span class="stores">'+d.category+'</span>':'';
    b.innerHTML='<span>'+d.name+(d.name_zh?' <span class="zh">'+d.name_zh+'</span>':'')+'</span>'+catTag+'<span class="stores">'+ns+' store'+(ns>1?'s':'')+'</span>';
    if(curItem===d)b.classList.add('active');
    b.onclick=()=>pick(d);itemsEl.appendChild(b);});
}
const storeBtn=document.getElementById('storeBtn'),storePanel=document.getElementById('storePanel');
let selStores=new Set(STORES);
function selectedStores(){return selStores.size?STORES.filter(s=>selStores.has(s)):STORES;}
function renderStoreOptions(){
  const all=selStores.size===STORES.length;
  storeBtn.textContent='Stores 商店: '+(all?'全部 ('+STORES.length+')':(selStores.size===1?[...selStores][0]:'已選 '+selStores.size+' 家'));
  storePanel.innerHTML='<div class="srow" data-v="__ALL__"><input type="checkbox"'+(all?' checked':'')+'> <b>全部 All</b></div>'+
    STORES.map(s=>'<div class="srow" data-v="'+s+'"><input type="checkbox"'+(selStores.has(s)?' checked':'')+'>'+s+
      '<span class="cnt">'+DATA.filter(d=>ents(d,s).length).length+' 項</span></div>').join('');
}
function applyStoreChange(v){
  const all=selStores.size===STORES.length;
  if(v==='__ALL__'){selStores=new Set(STORES);}
  else if(all){selStores=new Set([v]);}                     // all -> first tap isolates that store
  else if(selStores.size===1&&selStores.has(v)){selStores=new Set(STORES);} // tap the solo store again -> all
  else{
    if(selStores.has(v))selStores.delete(v);else selStores.add(v);
    if(selStores.size===0)selStores=new Set(STORES);
  }
  renderStoreOptions();renderItems();if(curItem)pick(curItem);
}
storeBtn.onclick=e=>{e.stopPropagation();storePanel.hidden=!storePanel.hidden;};
storePanel.onclick=e=>{e.stopPropagation();const row=e.target.closest('.srow');if(row)applyStoreChange(row.dataset.v);};
document.addEventListener('click',()=>{storePanel.hidden=true;});
renderStoreOptions();
searchEl.oninput=()=>{
  if(searchEl.value.trim()&&catSel.value!=='ALL'){catSel.value='ALL';curCat='ALL';}
  renderItems();
};
renderItems();
